name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: production-deploy
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 11
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm check
            - run: pnpm build
            - uses: actions/upload-artifact@v7
              with:
                  name: site
                  path: dist
                  if-no-files-found: error
                  retention-days: 1

    deploy:
        needs: build
        runs-on: [self-hosted, linux, arm64, thebe, deploy]
        environment:
            name: production
            url: https://elara.boo
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: site
                  path: release
            - name: Publish static site
              shell: sh
              run: |
                  set -eu
                  release="/srv/elara.boo/releases/${GITHUB_SHA}"
                  mkdir -p /srv/elara.boo/releases "$release"
                  cp -R release/. "$release"
                  ln -sfn "$release" /srv/elara.boo/current
